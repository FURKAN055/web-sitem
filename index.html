<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furkan'ın Dijital Dünyası</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .kart {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 2px solid #38bdf8;
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        .buton {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #38bdf8;
            color: #0f172a;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="kart">
        <h1>BAŞARDIK! 🚀</h1>
        <p>GitHub Pro ile ilk web sitemiz artık yayında.</p>
        <div class="buton">Sistem Aktif ✅</div>
    </div>
</body>
</html>
