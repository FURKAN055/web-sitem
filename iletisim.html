<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Furkan</title>
    <style>
        :root {
            --arka-plan: #0b0f19;
            --kart-renk: #161b28;
            --ana-mavi: #00d2ff;
            --yazi-beyaz: #ffffff;
            --yazi-gri: #94a3b8;
        }

        body { background-color: var(--arka-plan); color: var(--yazi-beyaz); font-family: sans-serif; margin: 0; }

        /* Menü */
        nav { display: flex; justify-content: space-around; align-items: center; padding: 20px 0; background: rgba(11, 15, 25, 0.9); border-bottom: 1px solid #1e293b; }
        nav a { color: var(--yazi-beyaz); text-decoration: none; margin: 0 15px; font-weight: 500; }
        nav a:hover { color: var(--ana-mavi); }
        .logo { font-size: 24px; font-weight: bold; color: var(--ana-mavi); text-decoration:none; }

        /* İletişim Bölümü */
        .container { max-width: 1000px; margin: 60px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
        
        .iletisim-bilgi h1 { font-size: 2.5rem; margin-bottom: 20px; }
        .iletisim-bilgi p { color: var(--yazi-gri); margin-bottom: 30px; }

        .bilgi-item { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        .icon-circle { width: 40px; height: 40px; background: #1e293b; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ana-mavi); border: 1px solid var(--ana-mavi); }

        /* Form Kısmı */
        .iletisim-form { background: var(--kart-renk); padding: 30px; border-radius: 20px; border: 1px solid #1e293b; }
        .form-grup { margin-bottom: 20px; }
        .form-grup label { display: block; margin-bottom: 8px; color: var(--yazi-gri); }
        .form-grup input, .form-grup textarea { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1e293b; border-radius: 8px; color: white; outline: none; }
        .form-grup input:focus { border-color: var(--ana-mavi); }

        .gonder-buton { width: 100%; padding: 15px; background: var(--ana-mavi); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .gonder-buton:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
