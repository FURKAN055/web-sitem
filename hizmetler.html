<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizmetlerimiz - Teknoay Bilişim</title>
    <style>
        :root {
            --arka-plan: #000000;
            --kart-renk: #ffffff;
            --ana-pembe: #ff007f;
            --yazi-koyu: #000000;
            --yazi-gri: #4b5563;
            --pembe-gradyan: linear-gradient(135deg, #ff007f 0%, #ff66b2 100%);
        }

        body { background-color: var(--arka-plan); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }

        /* Navigasyon */
        nav { display: flex; justify-content: space-around; align-items: center; padding: 20px 0; background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: 500; transition: 0.3s; }
        nav a:hover { color: var(--ana-pembe); }
        .logo { font-size: 24px; font-weight: bold; color: var(--ana-pembe); text-decoration:none; }

        /* Hizmetler Bölümü */
        .hizmet-bolumu {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
        }

        /* Sol Vurgu Alanı */
        .vurgu-alani {
            flex: 0 0 320px;
            background: var(--pembe-gradyan);
            border-radius: 20px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.3);
        }

        .vurgu-alani h2 { font-size: 2rem; margin-bottom: 15px; color: white; line-height: 1.2; }
        .vurgu-alani p { font-size: 1rem; color: white; margin-bottom: 25px; font-weight: 500; opacity: 0.9; }

        /* Sağ Grid */
        .hizmet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            flex-grow: 1;
        }

        /* Kart Tasarımı */
        .hizmet-kart {
            background: var(--kart-renk);
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .hizmet-kart:hover {
            transform: translateY(-12px);
            border-color: var(--ana-pembe);
            box-shadow: 0 20px 40px rgba(255, 0, 127, 0.2);
        }

        .hizmet-kart .ikon { font-size: 32px; margin-bottom: 15px; display: block; filter: grayscale(100%); transition: 0.3s; }
        .hizmet-kart:hover .ikon { filter: grayscale(0%); transform: scale(1.2); }

        .hizmet-kart h3 { color: var(--yazi-koyu); font-size: 1.1rem; margin: 0 0 12px 0; font-weight: 800; text-transform: uppercase; }
        .hizmet-kart p { color: var(--yazi-gri); font-size: 0.95rem; margin-bottom: 15px; line-height: 1.6; font-weight: 500; flex-grow: 1; }
        .hizmet-kart .bilgi-al { color: var(--ana-pembe); font-size: 0.9rem; font-weight: 700; }

        /* Footer */
        footer { background-color: #000000; padding: 60px 0 20px 0; border-top: 2px solid var(--ana-pembe); margin-top: 100px; }
        .footer-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 50px; padding: 0 20px; }
        .footer-box h4 { color: var(--ana-pembe); font-size: 1.2rem; margin-bottom: 20px; text-transform: uppercase; }
        .footer-box p, .footer-box a { color: #ffffff; text-decoration: none; font-size: 0.95rem; margin-bottom: 12px; display: block; opacity: 0.9; transition: 0.3s; }
        .footer-box a:hover { color: var(--ana-pembe); opacity: 1; }
        .copyright { text-align: center; margin-top: 50px; padding-top: 20px; border-top: 1px solid #333; color: #ffffff; opacity: 0.5; font-size: 0.85rem; }
