<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizmetlerimiz - Teknoay Bilişim</title>
    <style>
        :root {
            --arka-plan: #000000;
            --ana-pembe: #ff007f;
            --yazi-beyaz: #ffffff;
            --kart-arkaplan: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background-color: var(--arka-plan); 
            color: var(--yazi-beyaz); 
            font-family: 'Inter', sans-serif; 
            line-height: 1.6;
        }

        /* NAVİGASYON */
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 8%; 
            background: #000; 
            border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 26px; color: var(--ana-pembe); font-weight: 900; text-decoration: none; }
        .menu a { color: white; text-decoration: none; margin-left: 25px; font-weight: 600; transition: 0.3s; }
        .menu a:hover { color: var(--ana-pembe); }

        .container { max-width: 1200px; margin: 60px auto; padding: 0 20px; }

        /* ÜST PEMBE BANNER */
        .pink-banner { 
            background: linear-gradient(135deg, #ff007f 0%, #cc0066 100%); 
            border-radius: 25px; 
            padding: 50px; 
            text-align: center;
            margin-bottom: 50px;
            box-shadow: 0 15px 40px rgba(255, 0, 127, 0.4);
        }
        .pink-banner h1 { font-size: 2.8rem; margin-bottom: 15px; color: white; font-weight: 800; }
        .pink-banner p { font-size: 1.2rem; color: white; opacity: 0.9; }

        /* HİZMET KARTLARI - YAN YANA ÜÇLÜ DÜZEN */
        .services-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px; 
            margin-bottom: 100px;
        }
        
        .service-card { 
            background: var(--kart-arkaplan); 
            color: black; 
            padding: 30px; 
            border-radius: 20px; 
            text-decoration: none; 
            transition: 0.4s; 
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .service-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(255, 0, 127, 0.2); }
        .service-card h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 12px; color: #000; }
        .service-card p { font-size: 0.9rem; color: #555; }

        /* NEDEN BİZ VE İSTATİSTİKLER */
        .why-us-section { background: #080808; padding: 80px 0; border-top: 1px solid #1a1a1a; }
        .why-us-flex { display: flex; max-width: 1200px; margin: 0 auto; padding: 0 20px; gap: 60px; align-items: center; }
        
        .why-us-text { flex: 1.5; }
        .why-us-text h2 { font-size: 3rem; color: var(--ana-pembe); margin-bottom: 25px; font-weight: 900; }
        .why-us-text p { font-size: 1.1rem; color: #ddd; margin-bottom: 15px; }

        .stats-side { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .stat-box { 
            background: #111; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            border-bottom: 4px solid var(--ana-pembe); 
        }
        .stat-box h4 { font-size: 2.8rem; color: var(--ana-pembe); font-weight: 900; margin: 0; }
        .stat-box span { font-size: 0.8rem; color: white; opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; }

        /* FOOTER */
        footer { 
            background: #000; 
            border-top: 2px solid var(--ana-pembe); 
            padding: 60px 8% 30px; 
            display: flex; 
            justify-content: space-between;
            color: #aaa;
        }
        .footer-logo { color: var(--ana-pembe); font-weight: 900; }
