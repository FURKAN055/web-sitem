<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizmetlerimiz - Furkan Dijital</title>
    <style>
        :root {
            --arka-plan: #0b0f19;
            --kart-renk: #ffffff;
            --ana-mavi: #00d2ff;
            --yazi-koyu: #0f172a;
            --yazi-gri: #334155;
            --vurgu-gradyan: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
        }

        body { background-color: var(--arka-plan); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }

        /* Navigasyon */
        nav { display: flex; justify-content: space-around; align-items: center; padding: 20px 0; background: rgba(11, 15, 25, 0.95); border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: 500; transition: 0.3s; }
        nav a:hover { color: var(--ana-mavi); }
        .logo { font-size: 24px; font-weight: bold; color: var(--ana-mavi); text-decoration:none; }

        /* Hizmetler Konteynırı */
        .hizmet-bolumu {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
        }

        /* Sol Vurgu Alanı */
        .vurgu-alani {
            flex: 0 0 320px;
            background: var(--vurgu-gradyan);
            border-radius: 20px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.2);
        }

        .vurgu-alani h2 { font-size: 2rem; margin-bottom: 15px; line-height: 1.2; color: white; }
        .vurgu-alani p { font-size: 1rem; opacity: 0.95; margin-bottom: 25px; color: white; font-weight: 500; }

        /* Sağ Grid */
        .hizmet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            flex-grow: 1;
        }

        /* KART TASARIMI VE HOVER EFEKTLERİ */
        .hizmet-kart {
            background: var(--kart-renk);
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            border: 1px solid transparent;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
        }

        .hizmet-kart:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: var(--ana-mavi);
            box-shadow: 0 20px 40px rgba(0, 210, 255, 0.2);
            cursor: pointer;
        }

        .hizmet-kart .ikon { font-size: 32px; margin-bottom: 15px; transition: 0.3s; }
        .hizmet-kart:hover .ikon { transform: rotate(10deg) scale(1.2); }
        .hizmet-kart h3 { color: var(--yazi-koyu); font-size: 1.15rem; margin: 0 0 12px 0; font-weight: 800; }
        .hizmet-kart p { color: var(--yazi-gri); font-size: 0.98rem; margin-bottom: 15px; line-height: 1.6; flex-grow: 1; font-weight: 500; }
        .hizmet-kart .bilgi-al { color: var(--ana-mavi); font-size: 0.9rem; font-weight: 700; }

        /* FOOTER TASARIMI */
        footer { background-color: #050812; padding: 60px 0 20px 0; border-top: 1px solid #1e293b; margin-top: 100px; }
        .footer-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 50px; padding: 0 20px; }
        .footer-box h4 { color: var(--ana-mavi); font-size: 1.2rem; margin-bottom: 20px; text-transform: uppercase; }
        .footer-box p, .footer-box a { color: #94a3b8; text-decoration: none; font-size: 0.95rem; line-height: 1.8; display: block; margin-bottom: 10px; transition: 0.3s; }
        .footer-box a:hover { color: var(--ana-mavi); padding-left: 5px; }
        .copyright { text-align: center; margin-top: 50px; padding-top: 20px; border-top: 1px solid #1e293b; color: #64748b; font-size: 0.85rem; }

        @media (max-width: 1024px) {
            .hizmet-bolumu { flex-direction: column; }
            .vurgu-alani { flex: none; height: 250px; }
            .hizmet-grid { grid-template-columns: repeat(2, 1fr); }
            .footer-container { grid-template-columns: 1fr; text-align: center; }
        }
    </style>
</head>
