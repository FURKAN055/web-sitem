<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizmetlerimiz - Teknoay Bilişim</title>
    <style>
        :root {
            --arka-plan: #000000;
            --ana-pembe: #ff007f;
            --yazi-gri: #9ca3af;
        }

        body { 
            background-color: var(--arka-plan); 
            color: white; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.6;
        }

        /* NAVBAR */
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 8%; 
            background: rgba(0,0,0,0.95); 
            border-bottom: 1px solid #222; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        .logo { font-size: 26px; color: var(--ana-pembe); font-weight: 900; text-decoration: none; letter-spacing: 1px; }
        nav .links a { color: white; text-decoration: none; margin-left: 30px; font-weight: 600; transition: 0.3s; font-size: 15px; }
        nav .links a:hover { color: var(--ana-pembe); }

        .container { max-width: 1250px; margin: 0 auto; padding: 60px 20px; }

        /* ÜST BÖLÜM: TANITIM VE HİZMETLER */
        .hero-grid { display: grid; grid-template-columns: 1.2fr 2fr; gap: 40px; margin-bottom: 100px; }
        
        .hero-banner { 
            background: linear-gradient(135deg, #ff007f 0%, #cc0066 100%); 
            border-radius: 30px; 
            padding: 50px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            box-shadow: 0 20px 50px rgba(255, 0, 127, 0.2);
        }
        .hero-banner h1 { font-size: 2.8rem; line-height: 1.1; margin-bottom: 20px; color: white; }
        .hero-banner p { font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px; }
        .btn-beyaz { background: white; color: black; padding: 18px 35px; border-radius: 50px; text-decoration: none; font-weight: 800; text-align: center; transition: 0.3s; display: inline-block; width: fit-content; }
        .btn-beyaz:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }

        .hizmetler-listesi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .hizmet-kart { background: white; color: black; padding: 35px; border-radius: 25px; transition: 0.4s; text-decoration: none; border: 3px solid transparent; }
        .hizmet-kart:hover { transform: translateY(-10px); border-color: var(--ana-pembe); }
        .hizmet-kart .ikon { font-size: 40px; margin-bottom: 15px; display: block; }
        .hizmet-kart h3 { margin: 10px 0; font-size: 1.4rem; font-weight: 800; color: #000; }
        .hizmet-kart p { color: #555; font-size: 0.95rem; margin-bottom: 20px; }
        .bilgi-al { color: var(--ana-pembe); font-weight: 700; text-decoration: none; font-size: 0.9rem; }

        /* NEDEN BİZ BÖLÜMÜ */
        .neden-biz-section { background: #080808; padding: 100px 0; border-top: 1px solid #1a1a1a; }
        .neden-biz-flex { display: flex; max-width: 1200px; margin: 0 auto; padding: 0 20px; gap: 80px; align-items: center; }
        .neden-metin { flex: 1.5; }
        .neden-metin h2 { font-size: 3rem; color: var(--ana-pembe); margin-bottom: 30px; text-transform: uppercase; }
        .neden-metin p { font-size: 1.15rem; color: #ddd; margin-bottom: 25px; }
        .vurgu-cumle { font-size: 1.4rem; color: var(--ana-pembe); font-weight: 800; font-style: italic; border-left: 5px solid var(--ana-pembe); padding-left: 20px; margin-top: 40px; }

        .neden-stats { flex: 1; display: flex; flex-direction: column; gap: 25px; }
        .stat-item { background: #111; padding: 35px; border-radius: 20px; text-align: center; border-bottom: 4px solid var(--ana-pembe); }
        .stat-item h4 { font-size: 3rem; color: var(--ana-pembe); margin: 0; }
        .stat-item span { font-size: 0.9rem; color: white; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }

        /* FOOTER */
        footer { background: #000; border-top: 3px solid var(--ana-pembe); padding: 80px 0 40px; }
        .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 60px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .footer-box h5 { color: var(--ana-pembe); font-size: 1.2rem; margin-bottom: 25px; text-transform: uppercase; }
        .footer-box p, .footer-box a { color: #bbb; text-decoration: none; margin-bottom: 15px; display: block; font-size: 1rem; }
        .footer-box a:hover { color: white; }

        /* WHATSAPP */
        .whatsapp-float { 
            position: fixed; bottom: 30px; right: 30px; background: #25d366; width: 65px; height: 65px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            z-index: 2000; border: 2px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        @media (max-width: 1000px) {
            .hero-grid, .neden-biz-flex, .footer-grid { grid-template-columns: 1fr; flex-direction: column; text-align: center; }
            .hizmetler-listesi { grid-template-columns: 1fr; }
            .btn-beyaz { margin: 0 auto; }
            .neden-metin h2 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
