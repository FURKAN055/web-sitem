<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizmetlerimiz - Teknoay Bilişim</title>
    <style>
        :root {
            --arka-plan: #000000;
            --ana-pembe: #ff007f;
            --kart-arkaplan: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background-color: var(--arka-plan); 
            color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            line-height: 1.6;
        }

        /* NAVBAR */
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 25px 8%; 
            background: #000; 
            border-bottom: 1px solid #222;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 24px; color: var(--ana-pembe); font-weight: 900; text-decoration: none; }
        .menu a { color: white; text-decoration: none; margin-left: 30px; font-weight: 600; transition: 0.3s; }
        .menu a:hover { color: var(--ana-pembe); }

        .container { max-width: 1200px; margin: 60px auto; padding: 0 20px; }

        /* ÜST BÖLÜM: PEMBE KUTU VE KARTLAR */
        .main-layout {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        .left-promo-box {
            flex: 0 0 380px;
            background: #0a0a0a;
            border: 2px solid var(--ana-pembe);
            border-radius: 20px;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .left-promo-box h1 { font-size: 2.3rem; font-weight: 800; line-height: 1.1; margin-bottom: 15px; }
        .left-promo-box h1 span { color: var(--ana-pembe); display: block; }
        .left-promo-box p { color: #aaa; font-size: 0.95rem; margin-bottom: 25px; }
        .cta-button { 
            background: var(--ana-pembe); color: white; padding: 14px 28px; 
            border-radius: 12px; text-decoration: none; font-weight: bold; 
            width: fit-content; transition: 0.3s;
        }

        .right-cards-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .service-card {
            background: var(--kart-arkaplan);
            color: black;
            padding: 30px 25px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
        }
        .service-card h3 { font-size: 1.15rem; font-weight: 800; margin-bottom: 12px; color: #000; }
        .service-card p { font-size: 0.88rem; color: #444; line-height: 1.5; }

        /* ALT SIRADAKİ KARTLAR */
        .bottom-cards-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-top: 25px;
        }
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* NEDEN BİZ + İSTATİSTİKLER */
        .why-us-section {
            margin-top: 100px;
            padding: 80px 0;
            border-top: 1px solid #222;
            display: flex;
            align-items: flex-start;
            gap: 60px;
        }
        .why-us-info { flex: 1; }
        .why-us-info h2 { font-size: 2.8rem; font-weight: 900; margin-bottom: 25px; }
        .why-us-info h2 span { color: var(--ana-pembe); }
        .why-us-info p { color: #888; font-size: 1.05rem; line-height: 1.7; margin-bottom: 20px; }
        .why-us-quote { border-left: 3px solid var(--ana-pembe); padding-left: 20px; font-style: italic; color: #eee; margin-top: 30px; }
